<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" fill="none" role="img" aria-label="ZINE-IFY">
  <defs>
    <!-- Subtle paper drop shadow for individual collage cutouts -->
    <filter id="cutout-shadow" x="-8%" y="-8%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#120f0c" flood-opacity="0.32" />
    </filter>

    <filter id="pin-shadow" x="-15%" y="-15%" width="135%" height="135%" color-interpolation-filters="sRGB">
      <feDropShadow dx="1.5" dy="3" stdDeviation="2.5" flood-color="#0d0b09" flood-opacity="0.45" />
    </filter>

    <!-- Halftone dot pattern for zine print texture -->
    <pattern id="halftone-dark" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <circle cx="2" cy="2" r="1.15" fill="#181512" fill-opacity="0.14" />
      <circle cx="6" cy="6" r="0.85" fill="#181512" fill-opacity="0.1" />
    </pattern>

    <pattern id="halftone-light" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-14)">
      <circle cx="2.5" cy="2.5" r="1.1" fill="#f7f3ea" fill-opacity="0.14" />
      <circle cx="6.5" cy="6.5" r="0.8" fill="#f7f3ea" fill-opacity="0.09" />
    </pattern>

    <!-- Crimson ink gradient -->
    <linearGradient id="crimson-brush" x1="160" y1="315" x2="890" y2="295" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b81414" />
      <stop offset="35%" stop-color="#df1f26" />
      <stop offset="78%" stop-color="#f0282e" />
      <stop offset="100%" stop-color="#c5161b" />
    </linearGradient>
  </defs>

  <!-- ── REGISTRATION CROP MARKS (Subtle Printmaker Framing, Transparent BG) ── -->
  <g stroke="#e02424" stroke-width="1.75" stroke-linecap="round" opacity="0.55">
    <!-- Top-left crop mark -->
    <path d="M54 88 H82 M68 74 V102" />
    <!-- Bottom-right crop mark -->
    <path d="M882 356 H910 M896 342 V370" />
  </g>

  <!-- ── DARK PAPER COLLAGE BACKING FOR "-iFY" (With Torn Cream Paper Rim) ── -->
  <g filter="url(#cutout-shadow)">
    <!-- Outer torn cream deckle edge so dark cutout pops on both light & dark themes -->
    <polygon
      points="548,118 584,113 619,119 658,108 704,114 748,103 796,97 844,88 869,101 908,108 915,142 909,182 918,214 912,248 925,274 917,312 912,338 878,342 842,334 795,339 742,331 694,335 642,329 592,334 554,327 544,284 549,232 542,174"
      fill="#f6f1e6"
      stroke="#181512"
      stroke-width="3"
      stroke-linejoin="round"
    />
    <!-- Inner torn charcoal-black ink block -->
    <polygon
      points="558,128 590,122 626,127 664,117 708,122 752,112 798,106 842,98 864,110 899,116 905,146 899,184 908,215 901,247 912,273 905,306 901,328 872,332 838,324 792,329 742,321 692,325 644,320 596,324 564,318 555,278 559,228 553,174"
      fill="#151311"
    />
    <!-- Halftone overlay inside dark block -->
    <polygon
      points="558,128 590,122 626,127 664,117 708,122 752,112 798,106 842,98 864,110 899,116 905,146 899,184 908,215 901,247 912,273 905,306 901,328 872,332 838,324 792,329 742,321 692,325 644,320 596,324 564,318 555,278 559,228 553,174"
      fill="url(#halftone-light)"
    />
  </g>

  <!-- ── TORN PAPER SCRAP 1: "Z" + PUNK ANARCHY/STAR TAB ── -->
  <g filter="url(#cutout-shadow)">
    <polygon
      points="72,102 108,86 144,68 175,92 224,104 221,134 252,126 266,185 278,298 258,318 195,332 132,354 102,374 74,386 64,348 48,318 68,298 58,274 84,264 62,212 49,172 68,144 56,126"
      fill="#f7f2e7"
      stroke="#181512"
      stroke-width="3.2"
      stroke-linejoin="round"
    />
    <polygon
      points="72,102 108,86 144,68 175,92 224,104 221,134 252,126 266,185 278,298 258,318 195,332 132,354 102,374 74,386 64,348 48,318 68,298 58,274 84,264 62,212 49,172 68,144 56,126"
      fill="url(#halftone-dark)"
    />
    <!-- Distressed ink splatters on Z tile -->
    <circle cx="88" cy="242" r="2.2" fill="#181512" opacity="0.65" />
    <circle cx="96" cy="251" r="1.4" fill="#181512" opacity="0.5" />
    <circle cx="228" cy="268" r="2" fill="#181512" opacity="0.55" />
    <circle cx="114" cy="328" r="1.8" fill="#181512" opacity="0.6" />
  </g>

  <!-- ── TORN PAPER SCRAP 2: "I" ── -->
  <g filter="url(#cutout-shadow)">
    <polygon
      points="232,114 274,108 318,112 336,294 312,315 262,324 242,226"
      fill="#f2ece0"
      stroke="#181512"
      stroke-width="3"
      stroke-linejoin="round"
    />
    <polygon
      points="232,114 274,108 318,112 336,294 312,315 262,324 242,226"
      fill="url(#halftone-dark)"
    />
  </g>

  <!-- ── TORN PAPER SCRAP 3: "N" ── -->
  <g filter="url(#cutout-shadow)">
    <polygon
      points="306,112 362,105 416,96 446,292 402,308 332,316 314,218"
      fill="#f8f4ea"
      stroke="#181512"
      stroke-width="3"
      stroke-linejoin="round"
    />
    <polygon
      points="306,112 362,105 416,96 446,292 402,308 332,316 314,218"
      fill="url(#halftone-dark)"
    />
  </g>

  <!-- ── TORN PAPER SCRAP 4: "E" ── -->
  <g filter="url(#cutout-shadow)">
    <polygon
      points="422,114 468,116 466,104 514,98 568,84 574,124 558,162 566,288 524,302 444,306 432,208"
      fill="#f4efe3"
      stroke="#181512"
      stroke-width="3"
      stroke-linejoin="round"
    />
    <polygon
      points="422,114 468,116 466,104 514,98 568,84 574,124 558,162 566,288 524,302 444,306 432,208"
      fill="url(#halftone-dark)"
    />
    <!-- Dashed fold/cut line accent along right edge of E -->
    <line x1="554" y1="134" x2="561" y2="282" stroke="#181512" stroke-width="1.8" stroke-dasharray="6 5" opacity="0.45" />
  </g>

  <!-- ── TORN PAPER SCRAP 5: HYPHEN "-" CUTOUT ── -->
  <g filter="url(#cutout-shadow)">
    <polygon
      points="528,204 598,194 605,232 534,242"
      fill="#f7f2e7"
      stroke="#181512"
      stroke-width="2.8"
      stroke-linejoin="round"
    />
    <!-- Bold black hyphen bar -->
    <polygon
      points="540,213 590,205 594,224 543,232"
      fill="#141210"
    />
  </g>

  <!-- ── LETTERFORMS: "ZINE" (Distressed Brush / Cutout Block Letters) ── -->
  <!-- Letter "Z" -->
  <g fill="#141210">
    <!-- Top bar of Z -->
    <polygon points="78,196 226,144 235,176 88,228" />
    <!-- Diagonal slash of Z -->
    <polygon points="192,168 232,158 148,308 104,322" />
    <!-- Bottom bar of Z -->
    <polygon points="98,296 244,246 254,282 106,334" />
    <!-- Dry-brush distress splats & bristle tips on Z -->
    <path d="M70,202 L86,194 M68,212 L88,205 M74,222 L92,216 M236,252 L256,245 M242,266 L262,260 M96,326 L114,319" stroke="#141210" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Letter "i" (in ZINE) -->
  <g fill="#141210">
    <!-- Ink-splat dot -->
    <circle cx="273" cy="142" r="20" />
    <path d="M250,140 L296,144 M271,119 L275,164" stroke="#141210" stroke-width="3.5" stroke-linecap="round" />
    <!-- Vertical stem -->
    <polygon points="256,174 289,169 310,296 276,302" />
    <!-- Bristle drips at bottom -->
    <path d="M281,298 V312 M291,296 V315 M302,294 V308" stroke="#141210" stroke-width="3.2" stroke-linecap="round" />
  </g>

  <!-- Letter "N" -->
  <g fill="#141210">
    <!-- Left stem -->
    <polygon points="312,148 342,143 360,288 330,292" />
    <!-- Diagonal stroke -->
    <polygon points="326,148 354,144 422,276 394,282" />
    <!-- Right stem -->
    <polygon points="384,126 414,121 434,278 404,283" />
    <!-- Bristle drips -->
    <path d="M336,288 V304 M348,286 V301 M392,116 V132 M404,114 V130 M416,276 V294 M426,274 V290" stroke="#141210" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Letter "E" -->
  <g fill="#141210">
    <!-- Main vertical spine -->
    <polygon points="444,146 478,144 486,288 452,290" />
    <!-- Top bar -->
    <polygon points="452,146 544,136 547,168 456,178" />
    <!-- Middle bar -->
    <polygon points="458,206 534,197 537,225 460,234" />
    <!-- Bottom bar -->
    <polygon points="456,262 548,252 551,282 458,292" />
    <!-- Bristle tips -->
    <path d="M542,142 L558,140 M544,154 L562,152 M532,204 L548,202 M534,216 L546,214 M546,258 L562,256 M548,272 L564,270 M462,288 V303 M474,288 V301" stroke="#141210" stroke-width="3.2" stroke-linecap="round" />
  </g>

  <!-- ── LETTERFORMS: "iFY" (Cutout Off-White Brush Letters on Dark Scrap) ── -->
  <!-- Letter "i" -->
  <g fill="#f7f2e7">
    <circle cx="627" cy="144" r="16" />
    <polygon points="614,174 642,171 654,284 624,287" />
    <path d="M618,170 V162 M632,169 V160 M630,285 V296 M644,284 V294" stroke="#f7f2e7" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Letter "F" -->
  <g fill="#f7f2e7">
    <!-- Spine -->
    <polygon points="668,148 698,142 722,282 692,286" />
    <!-- Top bar -->
    <polygon points="674,148 758,122 768,150 684,176" />
    <!-- Middle bar -->
    <polygon points="686,204 756,178 765,204 694,230" />
    <!-- Bristle marks -->
    <path d="M756,128 L772,123 M762,140 L776,135 M754,184 L770,178 M700,282 V295 M712,280 V293" stroke="#f7f2e7" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Letter "Y" -->
  <g fill="#f7f2e7">
    <!-- Left upper arm -->
    <polygon points="774,132 802,122 842,202 816,214" />
    <!-- Right full diagonal stem -->
    <polygon points="862,120 892,128 820,294 792,286" />
    <!-- Bristle marks -->
    <path d="M870,114 L864,128 M882,117 L876,131 M798,286 L792,300 M810,290 L804,303" stroke="#f7f2e7" stroke-width="3.2" stroke-linecap="round" />
  </g>

  <!-- ── PUNK / ZINE DOODLES & ANARCHY STAMP ── -->
  <!-- Circle-A Stamp on upper-left of Z scrap -->
  <g stroke="#141210" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="144" cy="128" r="42" stroke-width="8" />
    <circle cx="144" cy="128" r="39" stroke-width="2" stroke-dasharray="12 6" />
    <!-- A legs -->
    <path d="M142,74 L110,178" stroke-width="9" />
    <path d="M142,74 L178,168" stroke-width="9" />
    <!-- A crossbar -->
    <path d="M90,152 L198,112" stroke-width="8.5" />
  </g>

  <!-- Bottom-left star doodles on torn paper tab -->
  <g stroke="#141210" stroke-width="4" stroke-linejoin="round" fill="none">
    <polygon points="86,322 92,342 110,342 96,352 102,370 86,358 70,370 76,352 62,342 80,342" />
    <polygon points="74,290 78,300 88,300 80,306 83,316 74,310 65,316 68,306 60,300 70,300" fill="#141210" />
  </g>

  <!-- Right-edge doodles (Lightning, stars, X stitches) -->
  <g stroke="#141210" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Star on bottom-right cream paper tab -->
    <polygon points="896,282 900,292 911,292 902,299 905,310 896,303 887,310 890,299 881,292 892,292" />
  </g>
  <g stroke="#f7f2e7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Lightning bolt inside dark block -->
    <polyline points="888,224 872,248 885,250 874,272" />
    <!-- Stitch X marks -->
    <path d="M876,196 L892,212 M892,196 L876,212" />
  </g>

  <!-- ── SAFETY PIN 1 (Top Center-Right, pinning E to -iFY) ── -->
  <g filter="url(#pin-shadow)" transform="translate(526, 118) rotate(-21)">
    <!-- Safety pin head clasp -->
    <path d="M46,-14 C64,-14 72,-6 72,2 C72,10 64,18 46,18 L32,16 L32,-12 Z" fill="#f7f2e7" stroke="#141210" stroke-width="3.5" />
    <circle cx="54" cy="2" r="5.5" fill="#141210" />
    <!-- Top & bottom wire shafts -->
    <line x1="-48" y1="-8" x2="34" y2="-8" stroke="#141210" stroke-width="4" stroke-linecap="round" />
    <line x1="-48" y1="10" x2="34" y2="10" stroke="#141210" stroke-width="4" stroke-linecap="round" />
    <line x1="-48" y1="-8" x2="34" y2="-8" stroke="#f7f2e7" stroke-width="1.4" stroke-linecap="round" />
    <!-- Coiled spring loop on left -->
    <circle cx="-52" cy="1" r="11" fill="#f7f2e7" stroke="#141210" stroke-width="4" />
    <circle cx="-52" cy="1" r="4.5" fill="#141210" />
  </g>

  <!-- ── SAFETY PIN 2 (Bottom-Left under Z) ── -->
  <g filter="url(#pin-shadow)" transform="translate(182, 362) rotate(20)">
    <!-- Torn paper backing tab for bottom safety pin -->
    <polygon
      points="-74,-22 68,-20 76,22 -70,20"
      fill="#f6f1e6"
      stroke="#181512"
      stroke-width="2.8"
      stroke-linejoin="round"
    />
    <!-- Safety pin head clasp -->
    <path d="M32,-12 C50,-12 58,-5 58,2 C58,9 50,16 32,16 L20,14 L20,-10 Z" fill="#f7f2e7" stroke="#141210" stroke-width="3.2" />
    <circle cx="42" cy="2" r="4.8" fill="#141210" />
    <!-- Wire shafts -->
    <line x1="-46" y1="-7" x2="22" y2="-7" stroke="#141210" stroke-width="3.6" stroke-linecap="round" />
    <line x1="-46" y1="9" x2="22" y2="9" stroke="#141210" stroke-width="3.6" stroke-linecap="round" />
    <!-- Coiled spring loop -->
    <circle cx="-50" cy="1" r="9.5" fill="#f7f2e7" stroke="#141210" stroke-width="3.6" />
    <circle cx="-50" cy="1" r="4" fill="#141210" />
  </g>

  <!-- ── CRIMSON BRUSH STROKE UNDERLINE & INK DRIPS ── -->
  <g filter="url(#cutout-shadow)">
    <!-- Main sweeping dry-brush crimson stroke -->
    <path
      d="M196,336 C310,304 495,286 685,279 C765,276 838,278 888,282 C874,292 848,298 812,300 C618,302 402,318 222,348 C206,350 192,344 196,336 Z"
      fill="url(#crimson-brush)"
    />
    <!-- Secondary upper bristle streak -->
    <path
      d="M254,316 C394,292 586,276 788,270 C816,269 842,271 862,273 C834,277 788,278 736,280 C556,286 384,302 254,316 Z"
      fill="#e02424"
      opacity="0.9"
    />
    <!-- Lower dry-brush texture streak -->
    <path
      d="M242,354 C398,326 592,310 792,306 C764,313 698,316 618,321 C466,329 338,342 242,354 Z"
      fill="#c8191e"
      opacity="0.88"
    />
    <!-- Vertical crimson ink drips on right -->
    <path
      d="M786,296 L786,342 C786,346 792,346 792,342 L792,296 Z"
      fill="#d91e24"
    />
    <path
      d="M802,296 L802,376 C802,383 811,383 811,376 L811,296 Z"
      fill="#e02424"
    />
    <circle cx="806.5" cy="382" r="5.5" fill="#e02424" />
    <path
      d="M822,295 L822,348 C822,353 829,353 829,348 L829,295 Z"
      fill="#c8191e"
    />
    <!-- Crimson splatter droplets -->
    <circle cx="292" cy="358" r="3.2" fill="#e02424" />
    <circle cx="314" cy="352" r="2" fill="#e02424" />
    <circle cx="518" cy="328" r="2.4" fill="#e02424" />
    <circle cx="764" cy="322" r="2.6" fill="#e02424" />
    <circle cx="842" cy="318" r="3" fill="#e02424" />
  </g>
</svg>
